{% extends "base.html" %}

{% block title %}Create Label{% endblock %}

{% block content %}
    <h1>Create label for {{ project.key }}</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Create label</button>
    </form>

    <p>
        <a href="{% url 'issues:label-list' workspace.slug project.key %}">
            Back to labels
        </a>
    </p>
{% endblock %}
