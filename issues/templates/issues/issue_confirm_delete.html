{% extends "base.html" %}

{% block title %}Delete Issue{% endblock %}

{% block content %}
    <div class="form-card danger-card">
        <h1>
            Delete {{ project.key }}-{{ issue.number }}?
        </h1>

        <p>
            Are you sure you want to delete
            <strong>{{ issue.title }}</strong>?
        </p>

        <p class="muted">
            This action cannot be undone.
        </p>

        <form method="post">
            {% csrf_token %}

            <div class="form-actions">
                <button
                    class="button button--danger"
                    type="submit"
                >
                    Delete issue
                </button>

                <a
                    class="button button--secondary"
                    href="{% url 'issues:detail' workspace.slug project.key issue.number %}"
                >
                    Cancel
                </a>
            </div>
        </form>
    </div>
{% endblock %}
