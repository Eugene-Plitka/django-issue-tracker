name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: issue_tracker_db
          POSTGRES_USER: issue_tracker_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U issue_tracker_user -d issue_tracker_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_NAME: issue_tracker_db
      DB_USER: issue_tracker_user
      DB_PASSWORD: test_password
      DB_HOST: 127.0.0.1
      DB_PORT: 5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Ruff
        run: ruff check .

      - name: Run tests
        run: python manage.py test
