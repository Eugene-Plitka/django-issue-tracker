{% extends "base.html" %}

{% block title %}Remove Project Member{% endblock %}

{% block content %}
    <div class="form-card danger-card">
        <h1>Remove project member?</h1>

        <p>
            Remove
            <strong>{{ membership.user.email }}</strong>
            from project
            <strong>{{ project.key }}</strong>?
        </p>

        <p class="muted">
            The user will lose direct access to this project.
        </p>

        <form method="post">
            {% csrf_token %}

            <div class="form-actions">
                <button
                    class="button button--danger"
                    type="submit"
                >
                    Remove member
                </button>

                <a
                    class="button button--secondary"
                    href="{% url 'projects:member-list' workspace.slug project.key %}"
                >
                    Cancel
                </a>
            </div>
        </form>
    </div>
{% endblock %}
