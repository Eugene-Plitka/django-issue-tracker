{% extends "base.html" %}

{% block title %}Add Project Member{% endblock %}

{% block content %}
    <h1>Add member to {{ project.key }}</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Add member</button>
    </form>

    <p>
        <a href="{% url 'projects:member-list' workspace.slug project.key %}">
            Back to project members
        </a>
    </p>
{% endblock %}
