{% extends "base.html" %}

{% block title %}{{ project.key }} - {{ project.name }}{% endblock %}

{% block content %}
    <h1>{{ project.key }} - {{ project.name }}</h1>

    <p>{{ project.description }}</p>

    <p>
        Workspace: {{ workspace.name }}
    </p>
    <p>
        <a href="{% url 'projects:member-list' workspace.slug project.key %}">
            Project members
        </a>
    </p>
    <p>
        <a href="{% url 'projects:list' workspace.slug %}">
            Back to projects
        </a>
    </p>
{% endblock %}
