{% extends "base.html" %}

{% block title %}Edit Member Role{% endblock %}

{% block content %}
    <div class="page-header">
        <div>
            <h1>Edit member role</h1>

            <p class="page-subtitle">
                {{ membership.user.email }}
            </p>
        </div>
    </div>

    <div class="form-card">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <div class="form-actions">
                <button
                    class="button button--primary"
                    type="submit"
                >
                    Save role
                </button>

                <a
                    class="button button--secondary"
                    href="{% url 'workspaces:member-list' workspace.slug %}"
                >
                    Cancel
                </a>
            </div>
        </form>
    </div>
{% endblock %}
