{% extends "base.html" %}

{% block title %}Workspaces{% endblock %}

{% block content %}
    <h1>Workspaces</h1>

    <p>
        <a href="{% url 'workspaces:create' %}">
            Create workspace
        </a>
    </p>

    <ul>
        {% for workspace in workspaces %}
            <li>
                <a href="{% url 'workspaces:detail' workspace.slug %}">
                    {{ workspace.name }}
                </a>
            </li>
        {% empty %}
            <li>No workspaces yet.</li>
        {% endfor %}
    </ul>
{% endblock %}
