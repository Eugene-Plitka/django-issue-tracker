<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Workspaces</title>
</head>
<body>
    <h1>Workspaces</h1>

    <ul>
        {% for workspace in workspaces %}
            <li>{{ workspace.name }}</li>
        {% empty %}
            <li>No workspaces yet.</li>
        {% endfor %}
    </ul>
</body>
</html>
