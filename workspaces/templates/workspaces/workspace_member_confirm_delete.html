{% extends "base.html" %}

{% block title %}Remove Member{% endblock %}

{% block content %}
    <h1>Remove member</h1>

    <p>
        Remove {{ membership.user.email }}
        from {{ workspace.name }}?
    </p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Remove</button>
    </form>

    <p>
        <a href="{% url 'workspaces:member-list' workspace.slug %}">
            Cancel
        </a>
    </p>
{% endblock %}
