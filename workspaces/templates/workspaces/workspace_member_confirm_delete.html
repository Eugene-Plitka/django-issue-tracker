{% extends "base.html" %}

{% block title %}Remove Member{% endblock %}

{% block content %}
    <div class="form-card danger-card">
        <h1>Remove member?</h1>

        <p>
            Remove
            <strong>{{ membership.user.email }}</strong>
            from
            <strong>{{ workspace.name }}</strong>?
        </p>

        <p class="muted">
            The user will lose access granted through this workspace membership.
        </p>

        <form method="post">
            {% csrf_token %}

            <div class="form-actions">
                <button
                    class="button button--danger"
                    type="submit"
                >
                    Remove member
                </button>

                <a
                    class="button button--secondary"
                    href="{% url 'workspaces:member-list' workspace.slug %}"
                >
                    Cancel
                </a>
            </div>
        </form>
    </div>
{% endblock %}
