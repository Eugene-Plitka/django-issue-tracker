{% extends "base.html" %}

{% block title %}Add Member{% endblock %}

{% block content %}
    <h1>Add member to {{ workspace.name }}</h1>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Add member</button>
    </form>

    <p>
        <a href="{% url 'workspaces:member-list' workspace.slug %}">
            Back to members
        </a>
    </p>
{% endblock %}
