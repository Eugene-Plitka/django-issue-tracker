services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: issue_tracker_db
      POSTGRES_USER: issue_tracker_user
      POSTGRES_PASSWORD: post12345
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U issue_tracker_user -d issue_tracker_db",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: