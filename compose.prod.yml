services:
  web:
    build:
      context: .
      dockerfile: Dockerfile

    command:
      - sh
      - -c
      - |
        python manage.py collectstatic --noinput &&
        exec gunicorn config.wsgi:application \
          --bind 0.0.0.0:8000 \
          --workers 2 \
          --timeout 60 \
          --access-logfile - \
          --error-logfile -

    env_file:
      - .env.prod

    environment:
      DB_HOST: eugene_postgres
      DB_PORT: "5432"

    expose:
      - "8000"

    networks:
      - eugene_proxy
      - eugene_database

    restart: unless-stopped
    mem_limit: 512m

networks:
  eugene_proxy:
    external: true

  eugene_database:
    external: true
